services:

  seaweedfs:
    image: chrislusf/seaweedfs:latest

    container_name: seaweedfs

    user: "1000:1000"

    restart: unless-stopped

    # Single-node: master + volume + filer + S3 gateway.
    command: server -dir=/data -filer -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024

    # Host ports differ from the MinIO/RustFS compose files so all can run together.
    ports:
      - "9004:8333"   # S3 API
      - "9005:9333"   # Master UI
      - "9006:8888"   # Filer UI

    env_file:
      - seaweedfs.env

    volumes:
      - /media/plamen/data1/nas/seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
